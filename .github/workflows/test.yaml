name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: smoke
    if: "!startsWith(github.head_ref, 'release-please--')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        uses: ./
        with:
          version-strategy: semver
          tag-prefix: v
          dry-run: "true"
          github-token: ${{ github.token }}

      - name: assert outputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SKIPPED: ${{ steps.release.outputs.skipped }}
          DRY_RUN: ${{ steps.release.outputs.dry-run }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "version=$VERSION skipped=$SKIPPED dry-run=$DRY_RUN tag=$TAG"
          [ "$DRY_RUN" = "true" ]
          [ -z "$TAG" ]
          [ -n "$VERSION" ] || [ "$SKIPPED" = "true" ]
